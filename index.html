<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Scene</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.166.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.166.1/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <canvas id="three-canvas"></canvas>
    <script type="module">
        import * as THREE from 'three';

        const canvas = document.getElementById('three-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Add a flat plane
        const planeGeometry = new THREE.PlaneGeometry(100, 100); // Large plane
        const planeMaterial = new THREE.MeshBasicMaterial({ color: 0xcccccc, side: THREE.DoubleSide });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2; // Rotate the plane to be horizontal
        scene.add(plane);

        // Add a skybox
        const loader = new THREE.CubeTextureLoader();
        const textureUrls = [
            'posx.png', 'negx.png',
            'posy.png', 'negy.png',
            'posz.png', 'negz.png'
        ];
        loader.load(textureUrls, (cubeTexture) => {
            scene.background = cubeTexture;
        });

        // Position camera
        camera.position.set(0, 10, 20); // Move camera up and back to see the plane

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
        });

        animate();
    </script>

</html>
